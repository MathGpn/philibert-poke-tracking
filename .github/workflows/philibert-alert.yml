name: Alerte Philibert

on:
  repository_dispatch:
    types: [philibert-alert]
  workflow_dispatch:
    inputs:
      subject:
        description: Objet de l'e-mail
        required: true
        default: "[Philibert] Test de l'alerte e-mail"
      body:
        description: Corps de l'e-mail (texte)
        required: true
        default: "Ceci est un e-mail de test envoyé depuis GitHub Actions."
      body_html:
        description: Corps HTML optionnel
        required: false
        default: ""

jobs:
  send-email:
    name: Envoyer l'e-mail Gmail
    runs-on: ubuntu-latest
    steps:
      - name: Envoyer l'e-mail
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_SUBJECT: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.subject || inputs.subject }}
          MAIL_BODY: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.body || inputs.body }}
          MAIL_BODY_HTML: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.body_html || inputs.body_html }}
        run: |
          python3 << 'PY'
          import os
          import smtplib
          import ssl
          import sys
          from email.message import EmailMessage

          address = (os.environ.get("GMAIL_ADDRESS") or "").strip()
          password = (os.environ.get("GMAIL_APP_PASSWORD") or "").replace(" ", "").strip()
          mail_to = (os.environ.get("MAIL_TO") or address).strip()
          subject = os.environ.get("MAIL_SUBJECT") or ""
          body = os.environ.get("MAIL_BODY") or ""
          body_html = os.environ.get("MAIL_BODY_HTML") or ""

          missing = [name for name, value in (
              ("GMAIL_ADDRESS", address),
              ("GMAIL_APP_PASSWORD", password),
              ("MAIL_TO", mail_to),
              ("MAIL_SUBJECT", subject),
              ("MAIL_BODY", body),
          ) if not value]
          if missing:
              print("Variables manquantes : " + ", ".join(missing), file=sys.stderr)
              sys.exit(1)

          message = EmailMessage()
          message["From"] = address
          message["To"] = mail_to
          message["Subject"] = subject
          message.set_content(body)
          if body_html.strip():
              message.add_alternative(body_html, subtype="html")

          context = ssl.create_default_context()
          with smtplib.SMTP("smtp.gmail.com", 587, timeout=30) as smtp:
              smtp.ehlo()
              smtp.starttls(context=context)
              smtp.ehlo()
              smtp.login(address, password)
              smtp.send_message(message)
          print(f"E-mail envoyé à {mail_to}")
          PY
