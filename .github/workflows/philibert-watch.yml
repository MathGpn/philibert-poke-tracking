name: Surveillance Philibert (toutes les 5 min)

# Un run boucle ~5h35 en vérifiant Philibert toutes les 5 minutes
# (scripts/actions_loop.sh), puis relance lui-même un nouveau run.
# Le cron ne sert que de filet de sécurité si la chaîne s'interrompt.
on:
  schedule:
    - cron: "3-58/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

# Au plus 1 run actif + 1 en attente : un nouveau run attend la fin du précédent.
concurrency:
  group: philibert-watch
  cancel-in-progress: false

jobs:
  watch:
    name: Vérifier Philibert en boucle
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Boucle de vérification (toutes les 5 min)
        timeout-minutes: 345
        env:
          NOTIFY: smtp
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONUNBUFFERED: "1"
          INTERVAL: "300"
          LOOP_MINUTES: "335"
        # Copie dans /tmp : la boucle fait des git reset qui peuvent modifier le fichier.
        run: |
          cp scripts/actions_loop.sh /tmp/actions_loop.sh
          bash /tmp/actions_loop.sh

      - name: Relancer un nouveau run
        # Toujours, sauf si le run a été annulé à la main (pour pouvoir arrêter la chaîne).
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in 1 2 3 4 5; do
            if gh workflow run philibert-watch.yml --ref main -R "$GITHUB_REPOSITORY"; then
              echo "Nouveau run demandé."
              exit 0
            fi
            sleep $((attempt * 10))
          done
          echo "::error::Impossible de relancer le workflow"
          exit 1
